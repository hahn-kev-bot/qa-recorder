# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed.
# Installed copies of QA Recorder find the release and update themselves.
# Release: npm version minor (or patch), then git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Use npm version to make the tag."
            exit 1
          fi

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
