# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed.
# Installed copies of QA Recorder find the release and update themselves.
# Release: npm version minor (or patch), then git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Use npm version to make the tag."
            exit 1
          fi

      - run: npm ci

      - name: Unit tests
        run: npm test

      # electron-builder uploads its files in parallel, and each upload creates the release if it's missing: left to
      # itself it made two releases for one tag. So the release exists (as a draft) before it uploads, and is
      # published once every file is on it.
      - name: Create the draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and upload it to the draft
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the files and publish the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for file in latest.yml "QA-Recorder-Setup-$version.exe" "QA-Recorder-Setup-$version.exe.blockmap"; do
            grep -qxF "$file" <<<"$assets" || { echo "::error::$file is missing from the release"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
