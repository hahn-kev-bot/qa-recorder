<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- QA Recorder: a tester's note with a check, drawn as the app draws it (an ink line on paper, a coloured head),
       with the red "recording" dot. The pale rim keeps the ink line visible on a dark taskbar. -->
  <g fill="#fffdf7" stroke="#fffdf7" stroke-width="30" stroke-linejoin="round">
    <rect x="37" y="50" width="188" height="180" rx="30"/>
    <rect x="27" y="40" width="188" height="180" rx="30"/>
    <circle cx="203" cy="52" r="28" fill="#fffdf7" stroke="#fffdf7" stroke-width="26"/>
  </g>
  <!-- the hard shadow of a comic panel -->
  <rect x="37" y="50" width="188" height="180" rx="30" fill="#14181f" stroke="#14181f" stroke-width="14"/>
  <!-- the note: paper, with the blue head of an Idea -->
  <clipPath id="card"><rect x="27" y="40" width="188" height="180" rx="30"/></clipPath>
  <g clip-path="url(#card)">
    <rect x="27" y="40" width="188" height="180" fill="#fffdf7"/>
    <rect x="27" y="40" width="188" height="66" fill="#1f6feb"/>
    <rect x="27" y="99" width="188" height="14" fill="#14181f"/>
  </g>
  <rect x="27" y="40" width="188" height="180" rx="30" fill="none" stroke="#14181f" stroke-width="14"/>
  <!-- check mark: QA, in the green of a Like -->
  <path d="M82 164l27 27 52-56" fill="none" stroke="#157a40" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- recording dot, with a paper keyline that lifts it off the note -->
  <circle cx="203" cy="52" r="28" fill="#fffdf7" stroke="#fffdf7" stroke-width="20"/>
  <circle cx="203" cy="52" r="28" fill="#d92d20" stroke="#14181f" stroke-width="10"/>
</svg>
