<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture cart</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #eef2ff; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  main { display: grid; grid-template-columns: 1fr 260px; gap: 20px; padding: 20px; }
  .photo { width: 320px; height: 200px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); border-radius: 8px; }
  aside { border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 220px; }
  button { font: inherit; padding: 6px 14px; }
  a { color: #4338ca; }
</style>
</head>
<body>
  <header>
    <h1>Fixture cart</h1>
    <button id="checkout">Checkout</button>
    <a href="#help">Help</a>
  </header>
  <main>
    <section>
      <h2>Blue teapot</h2>
      <div class="photo" role="img" aria-label="Product photo"></div>
    </section>
    <aside aria-label="Summary">
      <h2>Summary</h2>
      <div class="total">Total: $42</div>
    </aside>
  </main>
</body>
</html>
